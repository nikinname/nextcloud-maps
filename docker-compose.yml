services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-photomap}
      POSTGRES_USER: ${POSTGRES_USER:-photomap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-photomap}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-photomap} -d ${POSTGRES_DB:-photomap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - thumbnail_cache:/data/thumbnails
      - backup_data:/data/backups
    expose:
      - "8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8082:80"

volumes:
  db_data:
  thumbnail_cache:
  backup_data:
