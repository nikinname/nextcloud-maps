<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nextcloud Maps Companion</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="/style.css?v=2.1.0">
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="brandline">
          <h1>Nextcloud Maps Companion</h1>
          <span class="version">v2.1</span>
          <span class="codename">Bold Baboon</span>
        </div>
        <p id="status">Caricamento mappa...</p>
      </div>
      <div class="actions">
        <span id="userBadge" class="user-badge" hidden></span>
        <button id="logoutButton" class="secondary-action" type="button" hidden>Esci</button>
        <button id="scanButton" type="button">Avvia scansione</button>
        <a id="backupLink" class="button secondary" href="/api/admin/backup">Scarica backup</a>
      </div>
    </header>
    <section id="credentialsBanner" class="credentials-banner" hidden>
      <span id="credentialsMessage">Account Nextcloud da ricollegare.</span>
      <button id="reconnectButton" class="secondary-action" type="button">Ricollega Nextcloud</button>
    </section>
    <section id="loginPanel" class="login-panel" hidden>
      <div class="login-box">
        <h2>Accedi con Nextcloud</h2>
        <label>
          URL Nextcloud
          <input id="nextcloudUrl" type="url" placeholder="https://cloud.example.org">
        </label>
        <button id="loginButton" type="button">Accedi</button>
        <button id="resumeButton" class="secondary-action" type="button" hidden>Ho autorizzato, entra</button>
      </div>
    </section>
    <main id="appShell" hidden>
      <aside class="filters">
        <label>
          Dal
          <input id="fromDate" type="date">
        </label>
        <label>
          Al
          <input id="toDate" type="date">
        </label>
        <label>
          Cartella
          <input id="folder" type="text" placeholder="/Photos">
        </label>
        <button id="applyFilters" type="button">Filtra</button>
        <div id="adminToolbox" class="toolbox">
          <button id="adminReportButton" class="secondary-action" type="button">Report utenti</button>
          <label>
            Import backup
            <input id="backupFile" type="file" accept="application/gzip,application/json,.json,.json.gz">
          </label>
          <label class="confirm">
            <input id="confirmImport" type="checkbox">
            Confermo sostituzione dati
          </label>
          <button id="importBackupButton" type="button">Carica backup</button>
        </div>
      </aside>
      <section id="map" aria-label="Mappa foto"></section>
      <section id="adminReportPanel" class="admin-report" hidden>
        <div class="report-header">
          <h2>Report utenti</h2>
          <button id="closeReportButton" class="secondary-action" type="button">Chiudi</button>
        </div>
        <div id="adminReportContent" class="report-content"></div>
      </section>
    </main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script src="/app.js?v=2.1.0"></script>
  </body>
</html>
